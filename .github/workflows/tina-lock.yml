name: Tina lock check

# Fails PRs that change the Tina schema without regenerating tina/tina-lock.json.
# A stale lock makes TinaCloud index main with an outdated schema, which fails
# the `tinacms build` cloud check on Netlify (ERR_CLOUD_CHECK_FAILED).
# Also fails PRs whose schema leaves function residue (empty `ui: {}` on leaf
# fields) in the generated _schema.json — that likewise breaks the cloud check.

on:
  pull_request:
    branches: [main]

jobs:
  tina-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (regenerates Tina client + lock)
        run: pnpm build:local
      - name: Fail if tina-lock.json was not regenerated
        run: git diff --exit-code tina/tina-lock.json
      - name: Fail on function residue in the generated schema
        run: node scripts/check-tina-schema.mjs
