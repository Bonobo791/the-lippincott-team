# netlify.toml takes precedence over the Netlify UI for these settings.
[build]
  # Builds against TinaCloud — requires PUBLIC_TINA_CLIENT_ID and TINA_TOKEN
  # set in the Netlify UI (Site settings → Environment variables). The build
  # fails fast with ERR_MISSING_CLOUD_CREDS if they're missing; use
  # "pnpm build:local" instead for a credential-free local-content build.
  command = "pnpm build"
  # @astrojs/netlify (auto-selected by astro.config.mjs via the NETLIFY env
  # var) configures the publish directory and function routing automatically.

[build.environment]
  # `tinacms build` (the local-content indexer) exceeds Node's default ~2 GB
  # heap in Netlify's build container. Give V8 more headroom.
  NODE_OPTIONS = "--max-old-space-size=4096"

[context.production.environment]
  # Canonical production origin for sitemap/RSS/OpenGraph (Astro `site`).
  # Applies to the production context only, so deploy previews keep their
  # Netlify-injected URL. Correct after the DNS cutover to lippincottteam.com.
  SITE_URL = "https://lippincottteam.com"

# The shared `dev` branch carries Tina schema changes TinaCloud hasn't
# indexed (it indexes `main` on push), so the build's cloud schema check
# fails/hangs there. Build branch deploys and PR previews fully local;
# production keeps the TinaCloud check and self-heals once `dev` merges
# to `main` and TinaCloud reindexes.
[context.branch-deploy]
  command = "pnpm build:local"

[context.deploy-preview]
  command = "pnpm build:local"
