---
# Codacy analysis exclusions (.codacy.yaml at the repo root).
# Mirrors .gitignore, plus all Markdown files — documentation is not
# code-reviewed by the quality gate.
exclude_paths:
  # Markdown (docs/AGENTS/skills) — excluded per client request
  - "**/*.md"
  # Dependency / build output
  - "node_modules/**"
  - "dist/**"
  - "build/Release/**"
  - ".astro/**"
  - "tina/__generated__/**"
  - "scripts/migrate/data/**"
  - "*.tgz"
  - "package-lock.json"
  - "yarn.lock"
  - "bun.lockb"
  - "deno.lock"
  - ".yarn-integrity"
  - ".yarn/**"
  - ".pnp.*"
  # Environment / local files
  - ".env"
  - ".env.*"
  # Logs and runtime state
  - "logs/**"
  - "*.log"
  - "*.pid"
  - "*.seed"
  - "*.pid.lock"
  - "pids"
  - "report.[0-9]*.[0-9]*.[0-9]*.[0-9]*.json"
  - "npm-debug.log*"
  - "yarn-debug.log*"
  - "yarn-error.log*"
  - "lerna-debug.log*"
  - ".pnpm-debug.log*"
  # Tooling / agent output
  - ".playwright/**"
  - ".playwright-cli/**"
  - ".playwright-mcp/**"
  - ".impeccable/**"
  - ".prototools/**"
  - ".launch/**"
  - ".vercel/**"
  - ".netlify/**"
  - ".wrangler/**"
  - ".serena/**"
  - ".idea/**"
  - ".claude/**"
  - ".agents/**"
  - ".tokensave/**"
  - ".atl/**"
  - ".superpowers/**"
  - ".headroom/**"
  - ".codex/**"
  - ".cursor/**"
  - ".reasonix"
  - "/public/__moderaty_commit.txt"
